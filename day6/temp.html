<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <h1>Welcome to the Temperature Converted</h1>
    <input
      type="number"
      id="celsiusInput"
      placeholder="Enter temperature in Celsius"
    />
    <output id="fahrenheitOutput"
      >Temperature in Fahrenheit will appear here</output
    >

    <script>
      alert("Welcome to the Temperature Converter");
      document.getElementById("celsiusInput").addEventListener("input", function(){
        let temp = this.value;
        if (temp === "") {
          alert("Invalid or Empty temperature");
          
        } else {
          let converted=(Number(temp)*9)/5+32;
          document.getElementById("fahrenheitOutput").textContent =
            "Fahrenheit temp is "+converted;
        }
      });
    </script>
  </body>
</html>
